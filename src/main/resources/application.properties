spring.application.name=feedbook

# Dynamic Environment Mappings for Cloud Deployments
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cad_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:your_postgres_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:your_postgres_password}

# Autodesk Core Mappings
autodesk.aps.client-id=${AUTODESK_APS_CLIENT_ID}
autodesk.aps.client-secret=${AUTODESK_APS_CLIENT_SECRET}

# Hibernate Deployment Constraints
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
